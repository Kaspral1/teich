name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --extra dev

      - name: Run static checks and unit tests
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest tests/ -v -m "not integration" --tb=short

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test built wheel in an isolated environment
        run: |
          uv venv --python 3.12 .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/teich --help

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f docker/codex-runtime.Dockerfile -t teich-runtime:v3 .

      - name: Test Codex CLI in container
        run: |
          docker run --rm teich-runtime:v3 codex --version

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only run the slower Docker/runtime smokes on main.
    environment: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run integration tests
        env:
          TEICH_RUN_DOCKER_RUNTIME_SMOKE: "1"
        run: |
          uv run pytest tests/test_integration.py -v --tb=short
